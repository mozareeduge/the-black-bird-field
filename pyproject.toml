[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "the-black-bird-field"
version = "0.1.0"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest==9.1.1", "playwright==1.62.0", "axe-playwright-python==0.1.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
