<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Sign in · The Black Bird Field</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111;color:#eee;font:16px/1.4 system-ui,sans-serif}
  form{display:grid;gap:.8rem;width:min(20rem,86vw)}
  h1{font-size:1.1rem;font-weight:500;margin:0 0 .4rem}
  input,button{font:inherit;padding:.65rem .75rem;border-radius:4px;border:1px solid #444;background:#1c1c1c;color:#eee}
  button{background:#eee;color:#111;border:0;cursor:pointer}
  #msg{min-height:1.4em;color:#e88}
</style>
</head>
<body>
<form id="f" autocomplete="on" action="javascript:void 0" onsubmit="return false">
  <h1>The Black Bird Field — editor</h1>
  <input id="u" name="username" placeholder="Username" autocomplete="username" required>
  <input id="p" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
  <button>Sign in</button>
  <div id="msg" role="status"></div>
</form>
<script>
(async () => {
  const msg = document.getElementById('msg');
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const vaultReady = fetch('./vault.json', {cache: 'no-store'}).then(r => r.json());

  async function unlock(user, pass) {
    const vault = await vaultReady;
    const users = vault.users || {};
    const rec = users[user.trim().toLowerCase()];
    if (!rec) throw new Error('bad');
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name: 'PBKDF2', salt: b64(rec.salt), iterations: rec.iterations, hash: 'SHA-256'},
      base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(rec.iv)}, key, b64(rec.data));
    return new TextDecoder().decode(plain);
  }

  function handOver(token) {
    const provider = 'github';
    const opener = window.opener;
    if (!opener) {  // opened directly: store nothing, send the user to the editor
      msg.style.color = '#8c8'; msg.textContent = 'Password correct. Open the editor and choose “Sign in with GitHub”.';
      return;
    }
    const payload = 'authorization:' + provider + ':success:' + JSON.stringify({provider, token});
    const origin = location.origin;
    window.addEventListener('message', e => {
      if (e.origin === origin && e.data === 'authorizing:' + provider) {
        opener.postMessage(payload, origin);
        setTimeout(() => window.close(), 300);
      }
    });
    opener.postMessage('authorizing:' + provider, origin);
    msg.style.color = '#8c8'; msg.textContent = 'Signed in…';
  }

  // Lockout (policy lives in vault.json; owner changes it with scripts/set_login.py).
  const LS = 'tbbf-login-guard';
  const vault0 = await vaultReady.catch(() => ({}));
  const policy = Object.assign({max_attempts: 4, lock_hours: 3, reset_id: ''}, vault0.policy || {});
  const readGuard = () => {
    let g = {}; try { g = JSON.parse(localStorage.getItem(LS)) || {}; } catch {}
    if (g.reset_id !== policy.reset_id) g = {reset_id: policy.reset_id, fails: 0, until: 0};
    return g;
  };
  const saveGuard = g => localStorage.setItem(LS, JSON.stringify(g));
  const btn = document.querySelector('#f button');
  function showLock(g) {
    if (Date.now() < g.until) {
      btn.disabled = true;
      msg.textContent = 'Too many wrong attempts. Locked until ' +
        new Date(g.until).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'}) + '.';
      setTimeout(() => { btn.disabled = false; msg.textContent = ''; }, g.until - Date.now());
      return true;
    }
    return false;
  }
  showLock(readGuard());

  document.getElementById('f').addEventListener('submit', async e => {
    e.preventDefault(); msg.style.color = ''; msg.textContent = '';
    const g = readGuard();
    if (showLock(g)) return;
    btn.disabled = true;
    try {
      const token = await unlock(document.getElementById('u').value, document.getElementById('p').value);
      saveGuard({reset_id: policy.reset_id, fails: 0, until: 0});
      handOver(token);
    } catch {
      g.fails = (g.fails || 0) + 1;
      if (g.fails >= policy.max_attempts) { g.fails = 0; g.until = Date.now() + policy.lock_hours * 3600e3; }
      saveGuard(g);
      if (!showLock(g)) msg.textContent = 'Wrong username or password. ' +
        (policy.max_attempts - g.fails) + ' attempt(s) left.';
    } finally { if (Date.now() >= readGuard().until) btn.disabled = false; }
  });
})();
</script>
</body>
</html>
